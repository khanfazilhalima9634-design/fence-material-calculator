<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fence Material Calculator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Fence Material Calculator</h1><p>Calculate posts, rails, pickets, concrete bags and cost.</p></header>
<main class="container">
<section class="calculator">
<div class="grid">
<div class="input-group"><label>Fence Length (ft)</label><input id="length" type="number" value="100"></div>
<div class="input-group"><label>Fence Height</label><select id="height"><option value="4">4 ft</option><option value="6" selected>6 ft</option><option value="8">8 ft</option></select></div>
<div class="input-group"><label>Post Spacing (ft)</label><input id="spacing" type="number" value="8"></div>
<div class="input-group"><label>Rails</label><select id="rails"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div>
<div class="input-group"><label>Picket Width (in)</label><input id="picket" type="number" value="5.5"></div>
<div class="input-group"><label>Gap (in)</label><input id="gap" type="number" value="0.5"></div>
<div class="input-group"><label>Waste %</label><input id="waste" type="number" value="10"></div>
<div class="input-group"><label>Cost per Foot ($)</label><input id="cost" type="number" value="35"></div>
</div>
<div class="results">
<div class="card"><h3>Posts</h3><span id="posts">0</span></div>
<div class="card"><h3>Rails</h3><span id="railsOut">0</span></div>
<div class="card"><h3>Pickets</h3><span id="pickets">0</span></div>
<div class="card"><h3>Bags</h3><span id="bags">0</span></div>
<div class="card"><h3>Cost</h3><span id="price">$0</span></div>
</div>
<div class="button-group">
<button id="calculateBtn" class="primary-btn">Calculate</button>
<button id="copyBtn" class="secondary-btn">Copy Results</button>
</div>
<svg id="diagram" viewBox="0 0 800 180"></svg>
</section>
</main>
<script src="js/script.js"></script>
</body>
</html>
